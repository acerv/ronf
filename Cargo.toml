[package]
name = "ronf"
version = "0.1.0"
edition = "2021"
description = "Rust terminal multi-server IRC client"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
irc = "1.0.0"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
